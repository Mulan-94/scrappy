[build-system]
requires = [
    "setuptools>=42",
    "wheel"
]
build-backend = "setuptools.build_meta"


[project]
name = "scrappy"
authors = [
    {name = "Lexy Andati", email = "landati@duck.com"}
]
description = "Generate polarimetric spectra on independent lines of sight across a source"
license = {file = "LICENSE"}
requires-python = ">=3.8"
readme = "README.rst"
version = "0.2.0"
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.8",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Astronomy"
]
dependencies = [ 
    "astropy",
    "bokeh==2.4.3",
    "regions",
    "numpy",
    "matplotlib",
    "natsort",
    "scipy"
]


[project.optional-dependencies]
casa = ["casatasks"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-mock>=3.10.0",
    "coverage[toml]>=7.0.0",
    "black>=23.0.0", # code formater
    "isort>=5.12.0", # import sorter
    "flake8>=6.0.0", # linter coding style violations checker
    "mypy>=1.0.0", # check type hints and catche type-related bugs
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",  # for parallel test execution
    "pytest-mock>=3.10.0",  # for mocking
    "coverage[toml]>=7.0.0",
]


[project.scripts]
sc-los = "scrap.scrappy:console"
sc-losrm = "rmsynthesis.rm_synthesis:console"
sc-rmmap = "scrappy.rmsynthesis.rmmap_x2:console"
sc-bokehplot = "bkplots.plot_bk:console"
sc-ifit = "imageops.new_fit:console"
sc-beam-plot = "imageops.plot_bmaj_bmin:console"
sc-houdini = "imageops.simple_mask:console"
scrappy = "main:console"
sc-depol = "rmsynthesis.rmmap_x2:depol_shim"



[project.urls]
Repository = "https://github.com/Mulan-94/scrappy.git"
Documentation = "https://mulan-94.github.io/scrappy/"
Issues = "https://github.com/Mulan-94/scrappy"



[options]
packages = [
    "bkplots",
    "imageops",
    "rmsynthesis",
    "scrap",
    "utils"
]


# configuring pytest
[tool.pytest.ini_options]
# Test discovery
testpaths = ["tests", "src"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Nose-style setup/teardown support
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    # Coverage options
    "--cov=src",  # Replace 'src' with your package name/path
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=80",  # Fail if coverage below 80%
    # Nose-style options
    "--tb=short",  # Shorter traceback format
    "--show-capture=no",  # Don't show captured output unless test fails
]

# Test markers
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "math: marks tests for mathematical functions",
]


[tool.coverage.run]
source = ["src"]  # Replace with your source directory
branch = true # Were both sides of this if/else executed?
parallel = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/virtualenv/*",
    "*/.venv/*",
    "*/setup.py",
    "*/conftest.py",
    "*/.vscode/"
]

[tool.coverage.paths]
source = [
    "src/",
    "*/site-packages/",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",           # Explicit exclusion comment
    "def __repr__",              # String representation methods
    "if self.debug:",            # Debug-only code
    "if settings.DEBUG",         # Debug-only code
    "raise AssertionError",      # Should-never-happen assertions
    "raise NotImplementedError", # Abstract method placeholders
    "if 0:",                     # Dead code blocks
    "if __name__ == .__main__.:", # Script entry points
    "class .*\\bProtocol\\):",   # Protocol/interface definitions
    "@(abc\\.)?abstractmethod",  # Abstract method decorators
]
ignore_errors = true
show_missing = true
precision = 2

[tool.coverage.html]
directory = "htmlcov"


[tool.setuptools]
package-dir = {"scrappy" = "src/scrappy"}

[tool.setuptools.packages.find]
where = ["src"]


[tool.black]
line-length = 82
target-version = ['py37']

